name: BOAT Offline Article Doctor Tests

on:
  pull_request:
    paths:
      - ".github/workflows/boat-offline-tests.yml"
      - "BOAT/**"
      - "scripts/boat-article-doctor.mjs"
      - "scripts/test-boat-article-doctor.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  article-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run offline Article Doctor regression tests
        run: node --test scripts/test-boat-article-doctor.mjs
