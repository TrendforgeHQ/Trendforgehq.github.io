name: SEO Validator QA

on:
  pull_request:
    paths:
      - '.github/workflows/seo-validator-qa.yml'
      - 'scripts/validate-seo.ts'
      - 'lib/articles.ts'
      - 'lib/seo.ts'
      - 'content/articles/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Validate centralized SEO
        run: npx tsx scripts/validate-seo.ts
      - name: Build production site
        run: npm run build
      - name: Validate generated HTML title lengths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'out';
          const failures = [];
          let checked = 0;
          const decode = (s) => s
            .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
            .replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>').replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
            .replace(/&#x([\da-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)));
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) {
                // Google/Bing ownership verification files are not page metadata.
                if (/^(google|BingSiteAuth)[a-zA-Z0-9_-]*\.html$/i.test(entry.name)) continue;
                // Ignore title-like strings inside Next.js hydration scripts.
                const html = fs.readFileSync(full, 'utf8')
                  .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
                  .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, '');
                const matches = [...html.matchAll(/<title[^>]*>([\s\S]*?)<\/title>/gi)];
                if (matches.length === 0) failures.push(`${full}: no title tag found`);
                if (matches.length > 1) console.warn(`${full}: found ${matches.length} title tags; checking every rendered title length`);
                for (const match of matches) {
                  const title = decode(match[1].replace(/<[^>]+>/g, '').trim());
                  checked++;
                  if (!title) failures.push(`${full}: empty title`);
                  if (title.length > 70) failures.push(`${full}: title is ${title.length} characters (max 70): ${title}`);
                }
              }
            }
          }
          if (!fs.existsSync(root)) throw new Error('Production output directory out/ was not created');
          walk(root);
          console.log(`Checked ${checked} generated HTML title tags.`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
